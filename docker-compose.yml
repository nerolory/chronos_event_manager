services:
  # Основное приложение (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: chronos_app
    restart: unless-stopped
    ports:
      - "5173:5173"
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - chronos_network
    depends_on:
      - db
      - redis

  # Веб-сервер (Nginx)
  web:
    image: nginx:alpine
    container_name: chronos_web
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www
      - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - chronos_network

  # База данных (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: chronos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-chronos}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - chronos_network

  # Кэш и Очереди (Redis)
  redis:
    image: redis:7-alpine
    container_name: chronos_redis
    networks:
      - chronos_network

  # Воркер очередей Laravel
  queue:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: chronos_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www
    networks:
      - chronos_network
    depends_on:
      - db
      - redis

networks:
  chronos_network:
    driver: bridge

volumes:
  db_data:
